name: Production smoke check
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
jobs:
  smoke:
    if: vars.APP_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/smoke-production.mjs
        env:
          APP_URL: ${{ vars.APP_URL }}
